name = "bookshelf"
main = "src/index.ts"
compatibility_date = "2024-11-01"

# Workers Assets：托管 dist/ 下的 SPA；/api/* 由 Worker 处理（见 src/web/public/_routes.json）
assets = { directory = "./dist", binding = "ASSETS" }

[vars]
APP_NAME = "Bookshelf"

[[d1_databases]]
binding = "DB"
database_name = "bookshelf"
database_id = "01234567-89ab-cdef-0123-456789abcdef"  # 本地 dev 占位。真部署前请 `wrangler d1 create bookshelf` 并替换。
migrations_dir = "migrations"

[[r2_buckets]]
binding = "COVERS"
bucket_name = "bookshelf-covers"

[[kv_namespaces]]
binding = "KV"
id = "0123456789abcdef0123456789abcdef"   # 本地 dev 占位（合法 hex）。真部署前请运行 `wrangler kv namespace create bookshelf-kv` 并替换为真实 id。

# Secrets（不要写进仓库）：用 `wrangler secret put` 设置
#   SESSION_SECRET      签名会话 Cookie 的 HMAC 密钥（必填）
#   AI_BASE_URL         LLM 兼容接口地址（M4 用，可选）
#   AI_API_KEY          LLM API Key（M4 用，必填于 M4）
#   INITIAL_ADMIN_PASSWORD  首次部署 seed 初始管理员口令（setup 用，可选，未设则随机生成）