<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的书架 | Bookshelf</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                        serif: ['Noto Serif SC', 'Georgia', 'serif'],
                    },
                    colors: {
                        shelf: {
                            50: '#faf9f7',
                            100: '#f5f3ef',
                            200: '#e8e4dc',
                            300: '#d4cfc4',
                            400: '#b0a99a',
                            500: '#8a8274',
                            600: '#6b6458',
                            700: '#4a453d',
                            800: '#2d2a26',
                            900: '#1a1816',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #d4cfc4; border-radius: 3px; }
        .dark ::-webkit-scrollbar-thumb { background: #4a453d; }
        .book-card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .book-card:hover { transform: translateY(-4px); }
        .cover-pattern-1 { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .cover-pattern-2 { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); }
        .cover-pattern-3 { background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); }
        .cover-pattern-4 { background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%); }
        .cover-pattern-5 { background: linear-gradient(135deg, #fa709a 0%, #fee140 100%); }
        .cover-pattern-6 { background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%); }
        .cover-pattern-7 { background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%); }
        .cover-pattern-8 { background: linear-gradient(135deg, #fbc2eb 0%, #a6c1ee 100%); }
        .cover-pattern-9 { background: linear-gradient(135deg, #fdcbf1 0%, #e6dee9 100%); }
        .cover-pattern-10 { background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%); }
        .cover-pattern-11 { background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%); }
        .cover-pattern-12 { background: linear-gradient(135deg, #ff8a80 0%, #ea6100 100%); }
        @keyframes pulse-soft { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
        .status-reading { animation: pulse-soft 2s ease-in-out infinite; }
        .modal-backdrop { backdrop-filter: blur(8px); }
        .view-grid .book-card { opacity: 0; animation: fadeInUp 0.4s ease forwards; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
        .view-grid .book-card:nth-child(1) { animation-delay: 0.02s; }
        .view-grid .book-card:nth-child(2) { animation-delay: 0.04s; }
        .view-grid .book-card:nth-child(3) { animation-delay: 0.06s; }
        .view-grid .book-card:nth-child(4) { animation-delay: 0.08s; }
        .view-grid .book-card:nth-child(5) { animation-delay: 0.10s; }
        .view-grid .book-card:nth-child(6) { animation-delay: 0.12s; }
        .view-grid .book-card:nth-child(7) { animation-delay: 0.14s; }
        .view-grid .book-card:nth-child(8) { animation-delay: 0.16s; }
        .view-grid .book-card:nth-child(9) { animation-delay: 0.18s; }
        .view-grid .book-card:nth-child(10) { animation-delay: 0.20s; }
        .view-grid .book-card:nth-child(11) { animation-delay: 0.22s; }
        .view-grid .book-card:nth-child(12) { animation-delay: 0.24s; }
        .table-row { transition: background-color 0.15s ease; }
        .table-row:hover { background-color: rgba(0,0,0,0.02); }
        .dark .table-row:hover { background-color: rgba(255,255,255,0.03); }
        @media (max-width: 1024px) {
            .sidebar { transform: translateX(-100%); }
            .sidebar.open { transform: translateX(0); }
        }
        .fab { box-shadow: 0 4px 20px rgba(0,0,0,0.15); }
    </style>
</head>
<body class="bg-shelf-50 text-shelf-800 dark:bg-shelf-900 dark:text-shelf-200 font-sans antialiased transition-colors duration-300">

    <nav class="sticky top-0 z-40 bg-white/80 dark:bg-shelf-800/80 backdrop-blur-xl border-b border-shelf-200 dark:border-shelf-700 transition-colors duration-300">
        <div class="max-w-[1600px] mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center gap-3">
                    <button id="menuToggle" class="lg:hidden p-2 rounded-lg hover:bg-shelf-100 dark:hover:bg-shelf-700 transition-colors">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
                    </button>
                    <div class="flex items-center gap-2.5">
                        <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-amber-500 to-orange-600 flex items-center justify-center shadow-lg">
                            <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
                        </div>
                        <span class="text-lg font-bold tracking-tight font-serif">我的书架</span>
                    </div>
                </div>
                <div class="hidden md:flex flex-1 max-w-xl mx-8">
                    <div class="relative w-full">
                        <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-shelf-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                        <input type="text" id="searchInput" placeholder="搜索书名、作者、ISBN..." class="w-full pl-10 pr-4 py-2 rounded-xl bg-shelf-100 dark:bg-shelf-700 border-0 text-sm focus:ring-2 focus:ring-amber-500/50 focus:bg-white dark:focus:bg-shelf-600 transition-all placeholder:text-shelf-400">
                    </div>
                </div>
                <div class="flex items-center gap-2">
                    <button id="themeToggle" class="p-2 rounded-lg hover:bg-shelf-100 dark:hover:bg-shelf-700 transition-colors" title="切换主题">
                        <svg id="sunIcon" class="w-5 h-5 hidden dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
                        <svg id="moonIcon" class="w-5 h-5 block dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
                    </button>
                    <div class="hidden sm:flex items-center bg-shelf-100 dark:bg-shelf-700 rounded-lg p-1">
                        <button id="viewGrid" class="p-1.5 rounded-md bg-white dark:bg-shelf-600 shadow-sm transition-all" title="网格视图">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/></svg>
                        </button>
                        <button id="viewTable" class="p-1.5 rounded-md hover:bg-white/50 dark:hover:bg-shelf-600/50 transition-all" title="表格视图">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M3 14h18m-9-4v8m-7 0h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
                        </button>
                    </div>
                    <button onclick="openAddModal()" class="hidden sm:flex items-center gap-2 px-4 py-2 bg-shelf-800 dark:bg-amber-500 text-white dark:text-shelf-900 rounded-lg hover:bg-shelf-700 dark:hover:bg-amber-400 transition-all font-medium text-sm shadow-lg shadow-shelf-800/20">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
                        <span>添加书籍</span>
                    </button>
                </div>
            </div>
            <div class="md:hidden pb-3">
                <div class="relative">
                    <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-shelf-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                    <input type="text" id="searchInputMobile" placeholder="搜索书名、作者..." class="w-full pl-10 pr-4 py-2 rounded-xl bg-shelf-100 dark:bg-shelf-700 border-0 text-sm focus:ring-2 focus:ring-amber-500/50 transition-all placeholder:text-shelf-400">
                </div>
            </div>
        </div>
    </nav>

    <div class="max-w-[1600px] mx-auto flex">
        <aside id="sidebar" class="sidebar fixed lg:sticky lg:top-16 left-0 top-0 h-screen lg:h-[calc(100vh-4rem)] w-64 bg-white dark:bg-shelf-800 border-r border-shelf-200 dark:border-shelf-700 z-30 overflow-y-auto transition-transform duration-300 lg:translate-x-0">
            <div class="p-5 space-y-6">
                <div class="grid grid-cols-2 gap-3">
                    <div class="bg-shelf-50 dark:bg-shelf-700/50 rounded-xl p-3 text-center">
                        <div class="text-2xl font-bold text-shelf-800 dark:text-white font-serif">42</div>
                        <div class="text-xs text-shelf-500 dark:text-shelf-400 mt-0.5">总藏书</div>
                    </div>
                    <div class="bg-shelf-50 dark:bg-shelf-700/50 rounded-xl p-3 text-center">
                        <div class="text-2xl font-bold text-amber-600 dark:text-amber-400 font-serif">7</div>
                        <div class="text-xs text-shelf-500 dark:text-shelf-400 mt-0.5">在读</div>
                    </div>
                </div>
                <div>
                    <h3 class="text-xs font-semibold text-shelf-400 uppercase tracking-wider mb-3">阅读状态</h3>
                    <div class="space-y-1" id="statusFilters">
                        <button class="status-filter w-full flex items-center justify-between px-3 py-2 rounded-lg text-sm transition-colors bg-shelf-100 dark:bg-shelf-700 font-medium" data-status="all">
                            <span class="flex items-center gap-2.5"><span class="w-2 h-2 rounded-full bg-shelf-400"></span>全部书籍</span>
                            <span class="text-xs text-shelf-400 font-mono">42</span>
                        </button>
                        <button class="status-filter w-full flex items-center justify-between px-3 py-2 rounded-lg text-sm transition-colors hover:bg-shelf-50 dark:hover:bg-shelf-700/50" data-status="reading">
                            <span class="flex items-center gap-2.5"><span class="w-2 h-2 rounded-full bg-emerald-500 status-reading"></span>正在阅读</span>
                            <span class="text-xs text-shelf-400 font-mono">7</span>
                        </button>
                        <button class="status-filter w-full flex items-center justify-between px-3 py-2 rounded-lg text-sm transition-colors hover:bg-shelf-50 dark:hover:bg-shelf-700/50" data-status="finished">
                            <span class="flex items-center gap-2.5"><span class="w-2 h-2 rounded-full bg-amber-500"></span>已读完</span>
                            <span class="text-xs text-shelf-400 font-mono">18</span>
                        </button>
                        <button class="status-filter w-full flex items-center justify-between px-3 py-2 rounded-lg text-sm transition-colors hover:bg-shelf-50 dark:hover:bg-shelf-700/50" data-status="wish">
                            <span class="flex items-center gap-2.5"><span class="w-2 h-2 rounded-full bg-sky-500"></span>计划阅读</span>
                            <span class="text-xs text-shelf-400 font-mono">12</span>
                        </button>
                        <button class="status-filter w-full flex items-center justify-between px-3 py-2 rounded-lg text-sm transition-colors hover:bg-shelf-50 dark:hover:bg-shelf-700/50" data-status="dropped">
                            <span class="flex items-center gap-2.5"><span class="w-2 h-2 rounded-full bg-rose-400"></span>已搁置</span>
                            <span class="text-xs text-shelf-400 font-mono">3</span>
                        </button>
                        <button class="status-filter w-full flex items-center justify-between px-3 py-2 rounded-lg text-sm transition-colors hover:bg-shelf-50 dark:hover:bg-shelf-700/50" data-status="archived">
                            <span class="flex items-center gap-2.5"><span class="w-2 h-2 rounded-full bg-shelf-300"></span>已归档</span>
                            <span class="text-xs text-shelf-400 font-mono">2</span>
                        </button>
                    </div>
                </div>
                <div>
                    <div class="flex items-center justify-between mb-3">
                        <h3 class="text-xs font-semibold text-shelf-400 uppercase tracking-wider">分类</h3>
                        <button class="text-xs text-amber-600 dark:text-amber-400 hover:underline">管理</button>
                    </div>
                    <div class="space-y-1" id="categoryFilters">
                        <button class="category-filter w-full flex items-center justify-between px-3 py-2 rounded-lg text-sm transition-colors hover:bg-shelf-50 dark:hover:bg-shelf-700/50" data-category="文学">
                            <span class="flex items-center gap-2.5"><span class="w-2.5 h-2.5 rounded" style="background:#e11d48"></span>文学小说</span>
                            <span class="text-xs text-shelf-400 font-mono">15</span>
                        </button>
                        <button class="category-filter w-full flex items-center justify-between px-3 py-2 rounded-lg text-sm transition-colors hover:bg-shelf-50 dark:hover:bg-shelf-700/50" data-category="社科">
                            <span class="flex items-center gap-2.5"><span class="w-2.5 h-2.5 rounded" style="background:#2563eb"></span>社会科学</span>
                            <span class="text-xs text-shelf-400 font-mono">9</span>
                        </button>
                        <button class="category-filter w-full flex items-center justify-between px-3 py-2 rounded-lg text-sm transition-colors hover:bg-shelf-50 dark:hover:bg-shelf-700/50" data-category="科技">
                            <span class="flex items-center gap-2.5"><span class="w-2.5 h-2.5 rounded" style="background:#059669"></span>科技编程</span>
                            <span class="text-xs text-shelf-400 font-mono">8</span>
                        </button>
                        <button class="category-filter w-full flex items-center justify-between px-3 py-2 rounded-lg text-sm transition-colors hover:bg-shelf-50 dark:hover:bg-shelf-700/50" data-category="历史">
                            <span class="flex items-center gap-2.5"><span class="w-2.5 h-2.5 rounded" style="background:#d97706"></span>历史人文</span>
                            <span class="text-xs text-shelf-400 font-mono">6</span>
                        </button>
                        <button class="category-filter w-full flex items-center justify-between px-3 py-2 rounded-lg text-sm transition-colors hover:bg-shelf-50 dark:hover:bg-shelf-700/50" data-category="哲学">
                            <span class="flex items-center gap-2.5"><span class="w-2.5 h-2.5 rounded" style="background:#7c3aed"></span>哲学思辨</span>
                            <span class="text-xs text-shelf-400 font-mono">4</span>
                        </button>
                    </div>
                </div>
                <div>
                    <h3 class="text-xs font-semibold text-shelf-400 uppercase tracking-wider mb-3">热门标签</h3>
                    <div class="flex flex-wrap gap-2">
                        <span class="px-2.5 py-1 rounded-full text-xs bg-shelf-100 dark:bg-shelf-700 text-shelf-600 dark:text-shelf-300 cursor-pointer hover:bg-shelf-200 dark:hover:bg-shelf-600 transition-colors">经典</span>
                        <span class="px-2.5 py-1 rounded-full text-xs bg-shelf-100 dark:bg-shelf-700 text-shelf-600 dark:text-shelf-300 cursor-pointer hover:bg-shelf-200 dark:hover:bg-shelf-600 transition-colors">2024新书</span>
                        <span class="px-2.5 py-1 rounded-full text-xs bg-shelf-100 dark:bg-shelf-700 text-shelf-600 dark:text-shelf-300 cursor-pointer hover:bg-shelf-200 dark:hover:bg-shelf-600 transition-colors">推荐</span>
                        <span class="px-2.5 py-1 rounded-full text-xs bg-shelf-100 dark:bg-shelf-700 text-shelf-600 dark:text-shelf-300 cursor-pointer hover:bg-shelf-200 dark:hover:bg-shelf-600 transition-colors">重读</span>
                        <span class="px-2.5 py-1 rounded-full text-xs bg-shelf-100 dark:bg-shelf-700 text-shelf-600 dark:text-shelf-300 cursor-pointer hover:bg-shelf-200 dark:hover:bg-shelf-600 transition-colors">豆瓣高分</span>
                    </div>
                </div>
            </div>
        </aside>

        <div id="sidebarOverlay" class="fixed inset-0 bg-black/30 z-20 hidden lg:hidden modal-backdrop"></div>

        <main class="flex-1 min-w-0">
            <div class="sticky top-16 z-30 bg-shelf-50/80 dark:bg-shelf-900/80 backdrop-blur-lg border-b border-shelf-200 dark:border-shelf-700 px-4 sm:px-6 lg:px-8 py-3">
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <h2 id="currentViewTitle" class="text-lg font-semibold font-serif">全部书籍</h2>
                        <span id="bookCount" class="text-sm text-shelf-400">42 本</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="text-xs text-shelf-400 hidden sm:inline">排序：</span>
                        <select id="sortSelect" class="text-sm bg-white dark:bg-shelf-800 border border-shelf-200 dark:border-shelf-700 rounded-lg px-3 py-1.5 focus:ring-2 focus:ring-amber-500/50 outline-none">
                            <option value="recent">最近添加</option>
                            <option value="title">书名</option>
                            <option value="author">作者</option>
                            <option value="rating">评分</option>
                        </select>
                    </div>
                </div>
            </div>

            <div id="gridView" class="view-grid p-4 sm:p-6 lg:p-8">
                <div id="booksGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 xl:grid-cols-5 2xl:grid-cols-6 gap-4 sm:gap-5 lg:gap-6"></div>
            </div>

            <div id="tableView" class="hidden p-4 sm:p-6 lg:p-8">
                <div class="bg-white dark:bg-shelf-800 rounded-xl border border-shelf-200 dark:border-shelf-700 overflow-hidden shadow-sm">
                    <div class="overflow-x-auto">
                        <table class="w-full text-sm">
                            <thead>
                                <tr class="border-b border-shelf-200 dark:border-shelf-700 text-left text-xs text-shelf-500 dark:text-shelf-400 uppercase tracking-wider">
                                    <th class="px-4 py-3 font-medium">封面</th>
                                    <th class="px-4 py-3 font-medium">书名</th>
                                    <th class="px-4 py-3 font-medium">作者</th>
                                    <th class="px-4 py-3 font-medium">状态</th>
                                    <th class="px-4 py-3 font-medium">分类</th>
                                    <th class="px-4 py-3 font-medium">评分</th>
                                    <th class="px-4 py-3 font-medium">添加时间</th>
                                    <th class="px-4 py-3 font-medium text-right">操作</th>
                                </tr>
                            </thead>
                            <tbody id="booksTable" class="divide-y divide-shelf-100 dark:divide-shelf-700/50"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <button onclick="openAddModal()" class="fab sm:hidden fixed bottom-6 right-6 w-14 h-14 bg-shelf-800 dark:bg-amber-500 text-white dark:text-shelf-900 rounded-full flex items-center justify-center shadow-2xl z-40 hover:scale-105 transition-transform">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
    </button>

    <div id="detailModal" class="fixed inset-0 z-50 hidden">
        <div class="modal-backdrop absolute inset-0 bg-black/40 dark:bg-black/60 transition-opacity duration-300 opacity-0" id="detailBackdrop" onclick="closeDetailModal()"></div>
        <div class="absolute top-0 right-0 h-full w-full sm:w-[480px] lg:w-[520px] bg-white dark:bg-shelf-800 shadow-2xl transform translate-x-full transition-transform duration-300 ease-out pointer-events-auto overflow-y-auto" id="detailDrawer">
            <div id="detailContent"></div>
        </div>
    </div>

    <div id="addModal" class="fixed inset-0 z-50 hidden">
        <div class="modal-backdrop absolute inset-0 bg-black/40 dark:bg-black/60" onclick="closeAddModal()"></div>
        <div class="absolute inset-0 flex items-center justify-center p-4 pointer-events-none">
            <div class="bg-white dark:bg-shelf-800 rounded-2xl shadow-2xl max-w-lg w-full pointer-events-auto transform transition-all scale-95 opacity-0" id="addModalContent">
                <div class="p-6">
                    <div class="flex items-center justify-between mb-6">
                        <h3 class="text-xl font-bold font-serif">添加书籍</h3>
                        <button onclick="closeAddModal()" class="p-1 rounded-lg hover:bg-shelf-100 dark:hover:bg-shelf-700 transition-colors">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                        </button>
                    </div>
                    <div class="space-y-4">
                        <div>

            reading: { label: "正在阅读", color: "bg-emerald-100 text-emerald-700 dark:bg-emerald-900/30 dark:text-emerald-400", dot: "bg-emerald-500" },

        let currentView = 'grid';
        let currentFilter = { status: 'all', category: null, search: '' };
        let currentSort = 'recent';

        function getFilteredBooks() {
            let filtered = books;
            if (currentFilter.status !== 'all') {
                filtered = filtered.filter(b => b.status === currentFilter.status);
            }
            if (currentFilter.category) {
                filtered = filtered.filter(b => b.category === currentFilter.category);
            }
            if (currentFilter.search) {
                const s = currentFilter.search.toLowerCase();
                filtered = filtered.filter(b => b.title.toLowerCase().includes(s) || b.author.toLowerCase().includes(s) || b.isbn.includes(s));
            }
            filtered = [...filtered];
            if (currentSort === 'title') {
                filtered.sort((a, b) => a.title.localeCompare(b.title, 'zh'));
            } else if (currentSort === 'author') {
                filtered.sort((a, b) => a.author.localeCompare(b.author, 'zh'));
            } else if (currentSort === 'rating') {
                filtered.sort((a, b) => (b.rating || 0) - (a.rating || 0));
            } else {
                filtered.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
            }
            return filtered;
        }

                        <h3 class="font-semibold text-sm leading-tight line-clamp-1 group-hover:text-amber-600 dark:group-hover:text-amber-400 transition-colors">${book.title}</h3>
                        <p class="text-xs text-shelf-500 dark:text-shelf-400 line-clamp-1">${book.author}</p>
                        <div class="flex items-center gap-2 pt-0.5">
                            <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] font-medium ${status.color}">
                                <span class="w-1 h-1 rounded-full ${status.dot}"></span>${status.label}
                            </span>
                            ${book.rating ? `<span class="flex items-center gap-0.5">${renderStars(book.rating)}</span>` : ''}
                        </div>
                    </div>
                </div>`;
            }).join('');
            if (filtered.length === 0) {
                container.innerHTML = `<div class="col-span-full flex flex-col items-center justify-center py-20 text-shelf-400">
                    <svg class="w-16 h-16 mb-4 opacity-30" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
                    <p class="text-sm">没有找到符合条件的书籍</p>
                </div>`;
            }
        }

        function renderTable() {
            const container = document.getElementById('booksTable');
            const filtered = getFilteredBooks();
            document.getElementById('bookCount').textContent = filtered.length + ' 本';
            container.innerHTML = filtered.map(book => {
                const status = statusConfig[book.status];
                return `<tr class="table-row cursor-pointer" onclick="openDetailModal(${book.id})">
                    <td class="px-4 py-3"><div class="w-10 h-14 rounded-md overflow-hidden shadow-sm"><div class="cover-pattern-${book.coverPattern} w-full h-full flex items-center justify-center"><span class="text-white/80 text-[8px] font-bold text-center px-1 leading-tight">${book.title.slice(0,2)}</span></div></div></td>
                    <td class="px-4 py-3"><div class="font-medium text-sm">${book.title}</div><div class="text-xs text-shelf-400 mt-0.5">${book.subtitle || ''}</div></td>
                    <td class="px-4 py-3 text-sm text-shelf-600 dark:text-shelf-300">${book.author}</td>
                    <td class="px-4 py-3"><span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium ${status.color}"><span class="w-1.5 h-1.5 rounded-full ${status.dot}"></span>${status.label}</span></td>
                    <td class="px-4 py-3"><span class="inline-flex items-center gap-1.5 text-xs"><span class="w-2 h-2 rounded-sm" style="background:${book.categoryColor}"></span>${book.category}</span></td>
                    <td class="px-4 py-3"><div class="flex items-center gap-1">${renderStars(book.rating)}</div></td>
                    <td class="px-4 py-3 text-xs text-shelf-400">${book.createdAt}</td>
                    <td class="px-4 py-3 text-right"><button class="p-1.5 rounded-lg hover:bg-shelf-100 dark:hover:bg-shelf-700 transition-colors text-shelf-400 hover:text-shelf-600"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg></button></td>
                </tr>`;
            }).join('');
            if (filtered.length === 0) {
                container.innerHTML = `<tr><td colspan="8" class="px-4 py-16 text-center text-shelf-400 text-sm">没有找到符合条件的书籍</td></tr>`;
            }
        }

        function render() {
            if (currentView === 'grid') { renderGrid(); }
            else { renderTable(); }
        }

        function openDetailModal(bookId) {
            const book = books.find(b => b.id === bookId);
            if (!book) return;
            const status = statusConfig[book.status];
            const content = document.getElementById('detailContent');
            content.innerHTML = `<div class="relative">
                <div class="h-56 sm:h-64 cover-pattern-${book.coverPattern} relative overflow-hidden">
                    <div class="absolute inset-0 bg-black/20"></div>
                    <div class="absolute bottom-0 left-0 right-0 p-6 bg-gradient-to-t from-black/60 to-transparent">
                        <h2 class="text-2xl sm:text-3xl font-bold text-white font-serif drop-shadow-lg">${book.title}</h2>
                        ${book.subtitle ? `<p class="text-white/80 text-sm mt-1">${book.subtitle}</p>` : ''}
                    </div>
                    <button onclick="closeDetailModal()" class="absolute top-4 right-4 p-2 rounded-full bg-black/20 hover:bg-black/40 text-white transition-colors backdrop-blur-sm">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                    </button>
                </div>
                <div class="p-6 space-y-6">
                    <div class="flex flex-wrap items-center gap-3">
                        <span class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-sm font-medium ${status.color}"><span class="w-2 h-2 rounded-full ${status.dot}"></span>${status.label}</span>
                        <span class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-sm bg-shelf-100 dark:bg-shelf-700 text-shelf-600 dark:text-shelf-300"><span class="w-2 h-2 rounded-sm" style="background:${book.categoryColor}"></span>${book.category}</span>
                        ${book.rating ? `<span class="flex items-center gap-1">${renderStars(book.rating)}</span>` : ''}
                    </div>
                    <div class="grid grid-cols-2 gap-4 text-sm">
                        <div><div class="text-xs text-shelf-400 mb-1">作者</div><div class="font-medium">${book.author}</div></div>
                        <div><div class="text-xs text-shelf-400 mb-1">出版社</div><div class="font-medium">${book.publisher}</div></div>
                        <div><div class="text-xs text-shelf-400 mb-1">ISBN</div><div class="font-medium font-mono text-xs">${book.isbn}</div></div>
                        <div><div class="text-xs text-shelf-400 mb-1">页数</div><div class="font-medium">${book.pageCount} 页</div></div>
                    </div>
                    <div>
                        <div class="text-xs text-shelf-400 mb-2">简介</div>
                        <p class="text-sm leading-relaxed text-shelf-600 dark:text-shelf-300">${book.description}</p>
                    </div>
                    <div>
                        <div class="text-xs text-shelf-400 mb-2">标签</div>
                        <div class="flex flex-wrap gap-2">
                            ${book.tags.map(tag => `<span class="px-2.5 py-1 rounded-full text-xs bg-shelf-100 dark:bg-shelf-700 text-shelf-600 dark:text-shelf-300">${tag}</span>`).join('')}
                        </div>
                    </div>
                    <div class="flex gap-3 pt-2 pb-4">
                        <button onclick="closeDetailModal()" class="flex-1 px-4 py-2.5 border border-shelf-200 dark:border-shelf-600 rounded-lg text-sm font-medium hover:bg-shelf-50 dark:hover:bg-shelf-700 transition-colors">关闭</button>
                        <button onclick="closeDetailModal()" class="flex-1 px-4 py-2.5 bg-shelf-800 dark:bg-amber-500 text-white dark:text-shelf-900 rounded-lg text-sm font-medium hover:bg-shelf-700 dark:hover:bg-amber-400 transition-colors">编辑</button>
                    </div>
                </div>
            </div>`;
            const modal = document.getElementById('detailModal');
            const backdrop = document.getElementById('detailBackdrop');
            const drawer = document.getElementById('detailDrawer');
            modal.classList.remove('hidden');
            document.body.style.overflow = 'hidden';
            setTimeout(() => {
                backdrop.classList.remove('opacity-0');
                backdrop.classList.add('opacity-100');
                drawer.classList.remove('translate-x-full');
                drawer.classList.add('translate-x-0');
            }, 10);
        }

        function closeDetailModal() {
            const modal = document.getElementById('detailModal');
            const backdrop = document.getElementById('detailBackdrop');
            const drawer = document.getElementById('detailDrawer');
            backdrop.classList.remove('opacity-100');
            backdrop.classList.add('opacity-0');
            drawer.classList.remove('translate-x-0');
            drawer.classList.add('translate-x-full');
            document.body.style.overflow = '';
            setTimeout(() => { modal.classList.add('hidden'); }, 300);
        }

        function openAddModal() {
            const modal = document.getElementById('addModal');
            const modalContent = document.getElementById('addModalContent');
            modal.classList.remove('hidden');
            setTimeout(() => { modalContent.classList.remove('scale-95', 'opacity-0'); modalContent.classList.add('scale-100', 'opacity-100'); }, 10);
        }

        function closeAddModal() {
            const modal = document.getElementById('addModal');
            const modalContent = document.getElementById('addModalContent');
            modalContent.classList.remove('scale-100', 'opacity-100');
            modalContent.classList.add('scale-95', 'opacity-0');
            setTimeout(() => { modal.classList.add('hidden'); }, 200);
        }

        document.getElementById('menuToggle').addEventListener('click', () => {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('sidebarOverlay').classList.toggle('hidden');
        });
        document.getElementById('sidebarOverlay').addEventListener('click', () => {
            document.getElementById('sidebar').classList.remove('open');
            document.getElementById('sidebarOverlay').classList.add('hidden');
        });

        document.getElementById('themeToggle').addEventListener('click', () => {
            document.documentElement.classList.toggle('dark');
        });

        document.getElementById('viewGrid').addEventListener('click', () => {
            currentView = 'grid';
            document.getElementById('gridView').classList.remove('hidden');
            document.getElementById('tableView').classList.add('hidden');
            document.getElementById('viewGrid').classList.add('bg-white', 'dark:bg-shelf-600', 'shadow-sm');
            document.getElementById('viewGrid').classList.remove('hover:bg-white/50', 'dark:hover:bg-shelf-600/50');
            document.getElementById('viewTable').classList.remove('bg-white', 'dark:bg-shelf-600', 'shadow-sm');
            document.getElementById('viewTable').classList.add('hover:bg-white/50', 'dark:hover:bg-shelf-600/50');
            render();
        });

        document.getElementById('viewTable').addEventListener('click', () => {
            currentView = 'table';
            document.getElementById('gridView').classList.add('hidden');
            document.getElementById('tableView').classList.remove('hidden');
            document.getElementById('viewTable').classList.add('bg-white', 'dark:bg-shelf-600', 'shadow-sm');
            document.getElementById('viewTable').classList.remove('hover:bg-white/50', 'dark:hover:bg-shelf-600/50');
            document.getElementById('viewGrid').classList.remove('bg-white', 'dark:bg-shelf-600', 'shadow-sm');
            document.getElementById('viewGrid').classList.add('hover:bg-white/50', 'dark:hover:bg-shelf-600/50');
            render();
        });

        document.getElementById('sortSelect').addEventListener('change', (e) => {
            currentSort = e.target.value;
            render();
        });

        document.getElementById('searchInput').addEventListener('input', (e) => {
            currentFilter.search = e.target.value;
            render();
        });
        document.getElementById('searchInputMobile').addEventListener('input', (e) => {
            currentFilter.search = e.target.value;
            render();
        });

        document.querySelectorAll('.status-filter').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.status-filter').forEach(b => {
                    b.classList.remove('bg-shelf-100', 'dark:bg-shelf-700', 'font-medium');
                    b.classList.add('hover:bg-shelf-50', 'dark:hover:bg-shelf-700/50');
                });
                btn.classList.add('bg-shelf-100', 'dark:bg-shelf-700', 'font-medium');
                btn.classList.remove('hover:bg-shelf-50', 'dark:hover:bg-shelf-700/50');
                currentFilter.status = btn.dataset.status;
                const titles = { all: '全部书籍', reading: '正在阅读', finished: '已读完', wish: '计划阅读', dropped: '已搁置', archived: '已归档' };
                document.getElementById('currentViewTitle').textContent = titles[currentFilter.status];
                render();
            });
        });

        document.querySelectorAll('.category-filter').forEach(btn => {
            btn.addEventListener('click', () => {
                const isActive = btn.classList.contains('bg-shelf-100') || btn.classList.contains('dark:bg-shelf-700');
                document.querySelectorAll('.category-filter').forEach(b => {
                    b.classList.remove('bg-shelf-100', 'dark:bg-shelf-700', 'font-medium');
                    b.classList.add('hover:bg-shelf-50', 'dark:hover:bg-shelf-700/50');
                });
                if (!isActive) {
                    btn.classList.add('bg-shelf-100', 'dark:bg-shelf-700', 'font-medium');
                    btn.classList.remove('hover:bg-shelf-50', 'dark:hover:bg-shelf-700/50');
                    currentFilter.category = btn.dataset.category;
                    document.getElementById('currentViewTitle').textContent = btn.querySelector('span').textContent.trim();
                } else {
                    currentFilter.category = null;
                    document.getElementById('currentViewTitle').textContent = '全部书籍';
                }
                render();
            });
        });

        render();
    </script>
</body>
</html>
